# 收藏 → 设置：收藏一首诗、切主题 / 简繁 / 排版 / 字体字号 / 语速、清空收藏
appId: com.bluefrog.dailypoetry
name: 收藏与设置
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'today-poem'
    timeout: 45000

# 今日页收藏 —— 文案从「收藏」变成「已收藏」
- tapOn:
    id: 'act-favorite'
- assertVisible: '已收藏'
- takeScreenshot: favorited

# 收藏页应该能看到这一首
- tapOn: '收藏'
- assertVisible: '已收藏 1 首'
- assertVisible:
    id: 'favorites-list'
- takeScreenshot: favorites

# 设置：切深色主题
- tapOn: '设置'
- tapOn:
    id: 'theme-dark'
- assertVisible: '深色'
- takeScreenshot: settings-dark

# 简繁切换：繁體读 *_tw 列（语料原文），提示文案跟着变
- tapOn:
    id: 'script-tw'
- assertVisible: '正文用傳統繁體（保留語料原文）'
- takeScreenshot: settings-tw
- tapOn:
    id: 'script-cn'
- assertVisible: '正文用大陆简体（OpenCC 转写）'

# 排版：竖排（自右向左），预览变竖列，再切回横排
- tapOn:
    id: 'layout-vertical'
- assertVisible: '自右向左竖读，仿古籍版式'
- takeScreenshot: settings-vertical
- tapOn:
    id: 'layout-horizontal'
- assertVisible: '自左向右横读，长句更好排'

# 字体：宋体（衬线），再切特大字号，预览跟着变
- tapOn:
    id: 'font-song'
- assertVisible: '衬线体，横细竖粗、起收有顿，接近刻本'
- tapOn:
    id: 'size-xl'
- assertVisible: '正文字号 27，适合长辈阅读'
- takeScreenshot: settings-font-xl
- tapOn:
    id: 'size-md'
- tapOn:
    id: 'font-system'
- assertVisible: '跟随系统字体（黑体 / 苹方），笔画均匀'

# 朗读语速：慢 / 标准 / 快，试听按当前语速朗读
- scrollUntilVisible:
    element:
      id: 'rate-fast'
    direction: DOWN
- tapOn:
    id: 'rate-fast'
- assertVisible: '1.2× 语速，赶时间用'
- tapOn:
    id: 'rate-preview'
- tapOn:
    id: 'rate-normal'
- assertVisible: '0.9× 语速，接近吟诵节奏'

# 切回浅色，再切推送偏好为「应景优先」
- tapOn:
    id: 'theme-light'
- tapOn:
    id: 'push-occasion'
- assertVisible: '恰逢节日 / 节气当天，先推应景之作'
- assertVisible: '1 首' # 收藏数仍为 1
- takeScreenshot: settings-light

# 清空收藏：二次确认后回到「暂无」
- scrollUntilVisible:
    element:
      text: '清空收藏'
    direction: DOWN
- tapOn: '清空收藏'
- assertVisible: '将删除全部收藏，此操作不可恢复。'
- tapOn: '清空'
- assertVisible: '暂无'
