# 今日：开屏 → 等到今日诗篇 → 翻到前一天 → 再翻回来 → 右滑 / 左滑各翻一次
#
# 前提：设备上已装好 Debug 包（just android-install），Metro 在 8081 上跑着
# （just start），并且 adb 能看到设备（just android-doctor）。
appId: com.bluefrog.dailypoetry
name: 今日一诗
---
- launchApp:
    clearState: true # 清掉旧库，让 App 重新从 assets 里释放 poetry.db

# 首屏要拷库 + 建索引，慢设备上会停留几秒（顶栏现在是「日期 · 星期 + 农历」，没有大标题）
- assertVisible:
    id: 'day-prev'
- extendedWaitUntil:
    visible:
      id: 'today-poem'
    timeout: 45000

- assertVisible: '农历.*'
- takeScreenshot: today

# 前一天：日期与诗都应变化
- tapOn:
    id: 'day-prev'
- extendedWaitUntil:
    visible:
      id: 'today-poem'
    timeout: 15000
- takeScreenshot: yesterday

# 回到今天（未来不可点，所以这里点「后一天」是安全的）
- tapOn:
    id: 'day-next'
- extendedWaitUntil:
    visible:
      id: 'today-poem'
    timeout: 15000
# 顶栏是 ScrollView 外面的一层，永远可见（「左右滑动」提示在诗卡下面，可能要滚才看得到）
- assertVisible: '农历.*'

# 左右滑动也要能翻日：右滑回前一天，再左滑回今天
- swipe:
    from:
      id: 'today-swipe'
    direction: RIGHT
- extendedWaitUntil:
    visible:
      id: 'today-poem'
    timeout: 15000
- takeScreenshot: swiped-yesterday
- swipe:
    from:
      id: 'today-swipe'
    direction: LEFT
- extendedWaitUntil:
    visible:
      id: 'today-poem'
    timeout: 15000
- assertVisible: '左右滑动.*'
