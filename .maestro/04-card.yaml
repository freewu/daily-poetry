# 卡片：今日诗篇 → 存图 → 卡片页应有笺纸与「保存到相册」
#
# 只走到截图之前：写入相册是真的副作用（会在设备/模拟器里留下图片），
# 权限弹窗在不同系统版本上也不一样，冒烟只验路由与渲染。
appId: com.bluefrog.dailypoetry
name: 诗词卡片
---
- launchApp

- extendedWaitUntil:
    visible:
      id: 'today-poem'
    timeout: 45000

# 底部操作栏的「存图」
- tapOn:
    id: 'act-card'

- extendedWaitUntil:
    visible:
      id: 'share-card'
    timeout: 15000
- assertVisible: '保存到相册'
- assertVisible: '每日一诗'
- takeScreenshot: card

# 返回首页，不该留在卡片页
- back
- extendedWaitUntil:
    visible:
      id: 'today-poem'
    timeout: 15000
