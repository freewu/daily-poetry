# 卡片：今日诗篇 → 分享 → 卡片页应有笺纸与「保存并分享」
#
# 只走到截图之前：写入相册、弹系统分享面板都是真副作用（会留图片、
# 盖住 App），权限弹窗在各系统版本上也不同，冒烟只验路由与渲染。
appId: com.bluefrog.dailypoetry
name: 诗词卡片
---
- launchApp

- extendedWaitUntil:
    visible:
      id: 'today-poem'
    timeout: 45000

# 底部操作栏的「分享」
- tapOn:
    id: 'act-card'

- extendedWaitUntil:
    visible:
      id: 'share-card'
    timeout: 15000
- assertVisible: '保存并分享'
- assertVisible: '每日一诗'
- takeScreenshot: card

# 返回首页，不该留在卡片页
- back
- extendedWaitUntil:
    visible:
      id: 'today-poem'
    timeout: 15000
